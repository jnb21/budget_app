# Local development database. Start it with: docker compose up -d
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-budget}
      POSTGRES_DB: ${POSTGRES_DB:-budget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # 127.0.0.1 = reachable from this Mac only, not from the network.
      # 5433 on the Mac -> 5432 in the container (5432 is used by job-tracker).
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql   # keeps the data when the container is recreated
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 10

volumes:
  pgdata:
